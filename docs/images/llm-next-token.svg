<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="980" height="350" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <text x="18" y="28" font-size="17" font-weight="bold" fill="#1a1a1a">What the model actually does: predict the next token</text>
  <text x="18" y="50" font-size="13" fill="#555555">Every use of a language model, including classifying a tweet, is this operation repeated.</text>

  <!-- 1. text -->
  <rect x="18" y="78" width="168" height="58" rx="4" fill="#eef3f8" stroke="#4682b4" stroke-width="1.4"/>
  <text x="102" y="102" font-size="12.5" fill="#1a1a1a" text-anchor="middle">"Europe is ready and</text>
  <text x="102" y="120" font-size="12.5" fill="#1a1a1a" text-anchor="middle">willing to step"</text>
  <text x="102" y="152" font-size="11.5" fill="#555555" text-anchor="middle" font-style="italic">1. your text</text>

  <path d="M192.0 107.0 L213.0 107.0" stroke="#888888" stroke-width="1.4" /><polygon points="222.0,107.0 213.0,103.0 213.0,111.0" fill="#888888"/>

  <!-- 2. tokens -->
  <g>
    <rect x="228" y="82" width="52" height="24" rx="3" fill="#ffffff" stroke="#888888"/>
    <text x="254" y="99" font-size="11.5" fill="#1a1a1a" text-anchor="middle">Europe</text>
    <rect x="228" y="110" width="52" height="24" rx="3" fill="#ffffff" stroke="#888888"/>
    <text x="254" y="127" font-size="11.5" fill="#1a1a1a" text-anchor="middle">is</text>
    <rect x="286" y="82" width="52" height="24" rx="3" fill="#ffffff" stroke="#888888"/>
    <text x="312" y="99" font-size="11.5" fill="#1a1a1a" text-anchor="middle">ready</text>
    <rect x="286" y="110" width="52" height="24" rx="3" fill="#ffffff" stroke="#888888"/>
    <text x="312" y="127" font-size="11.5" fill="#1a1a1a" text-anchor="middle">will</text>
    <rect x="344" y="82" width="52" height="24" rx="3" fill="#ffffff" stroke="#888888"/>
    <text x="370" y="99" font-size="11.5" fill="#1a1a1a" text-anchor="middle">ing</text>
    <rect x="344" y="110" width="52" height="24" rx="3" fill="#ffffff" stroke="#888888"/>
    <text x="370" y="127" font-size="11.5" fill="#1a1a1a" text-anchor="middle">to</text>
  </g>
  <text x="312" y="152" font-size="11.5" fill="#555555" text-anchor="middle" font-style="italic">2. tokens</text>
  <text x="312" y="170" font-size="10.5" fill="#777777" text-anchor="middle">pieces of words, not words</text>

  <path d="M402.0 107.0 L423.0 107.0" stroke="#888888" stroke-width="1.4" /><polygon points="432.0,107.0 423.0,103.0 423.0,111.0" fill="#888888"/>

  <!-- 3. embeddings -->
  <g stroke="#4682b4" fill="#4682b4">
    <rect x="438" y="82" width="15" height="52" rx="2" opacity="0.30"/>
    <rect x="456" y="82" width="15" height="52" rx="2" opacity="0.55"/>
    <rect x="474" y="82" width="15" height="52" rx="2" opacity="0.20"/>
    <rect x="492" y="82" width="15" height="52" rx="2" opacity="0.70"/>
    <rect x="510" y="82" width="15" height="52" rx="2" opacity="0.40"/>
  </g>
  <text x="481" y="152" font-size="11.5" fill="#555555" text-anchor="middle" font-style="italic">3. embeddings</text>
  <text x="481" y="170" font-size="10.5" fill="#777777" text-anchor="middle">each token becomes a vector</text>

  <path d="M531.0 107.0 L552.0 107.0" stroke="#888888" stroke-width="1.4" /><polygon points="561.0,107.0 552.0,103.0 552.0,111.0" fill="#888888"/>

  <!-- 4. the model -->
  <rect x="567" y="70" width="150" height="74" rx="4" fill="#f6eaea" stroke="#800000" stroke-width="1.4"/>
  <text x="642" y="94" font-size="12.5" fill="#1a1a1a" text-anchor="middle">stacked layers</text>
  <text x="642" y="112" font-size="12.5" fill="#1a1a1a" text-anchor="middle">of attention</text>
  <text x="642" y="132" font-size="10.5" fill="#777777" text-anchor="middle">billions of weights</text>
  <text x="642" y="162" font-size="11.5" fill="#555555" text-anchor="middle" font-style="italic">4. the model</text>
  <text x="642" y="180" font-size="10.5" fill="#777777" text-anchor="middle">every token can look at</text>
  <text x="642" y="194" font-size="10.5" fill="#777777" text-anchor="middle">every earlier token</text>

  <path d="M723.0 107.0 L744.0 107.0" stroke="#888888" stroke-width="1.4" /><polygon points="753.0,107.0 744.0,103.0 744.0,111.0" fill="#888888"/>

  <!-- 5. distribution -->
  <g>
    <rect x="806" y="78" width="118" height="14" fill="#4682b4"/>
    <text x="800" y="89" font-size="11" fill="#1a1a1a" text-anchor="end">up</text>
    <text x="930" y="89" font-size="10" fill="#777777">.61</text>

    <rect x="806" y="97" width="56" height="14" fill="#4682b4" opacity="0.75"/>
    <text x="800" y="108" font-size="11" fill="#1a1a1a" text-anchor="end">forward</text>
    <text x="930" y="108" font-size="10" fill="#777777">.22</text>

    <rect x="806" y="116" width="25" height="14" fill="#4682b4" opacity="0.55"/>
    <text x="800" y="127" font-size="11" fill="#1a1a1a" text-anchor="end">in</text>
    <text x="930" y="127" font-size="10" fill="#777777">.09</text>

    <rect x="806" y="135" width="12" height="14" fill="#4682b4" opacity="0.35"/>
    <text x="800" y="146" font-size="11" fill="#1a1a1a" text-anchor="end">aside</text>
    <text x="930" y="146" font-size="10" fill="#777777">.04</text>
  </g>
  <text x="862" y="172" font-size="11.5" fill="#555555" text-anchor="middle" font-style="italic">5. a probability for every token</text>
  <text x="862" y="190" font-size="10.5" fill="#777777" text-anchor="middle">in the whole vocabulary</text>

  <!-- bottom explanation -->
  <line x1="18" y1="226" x2="962" y2="226" stroke="#dddddd" stroke-width="1"/>

  <text x="18" y="250" font-size="12.5" font-weight="bold" fill="#1a1a1a">Choosing one of them.</text>
  <text x="18" y="270" font-size="12.5" fill="#1a1a1a">Always taking the highest bar gives the same answer every time. Sampling from the bars does not, which is why</text>
  <text x="18" y="288" font-size="12.5" fill="#1a1a1a">the same request can return two different answers. Temperature controls how flat the bars are made before</text>
  <text x="18" y="306" font-size="12.5" fill="#1a1a1a">sampling: at zero the model always takes the top one, and higher values make unlikely tokens more reachable.</text>

  <text x="18" y="330" font-size="12.5" fill="#1a1a1a">Then the chosen token is added to the text, and the whole process runs again for the token after it.</text>

</svg>
