<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="430" fill="#ffffff"/>

  <text x="18" y="28" font-size="17" font-weight="bold" fill="#1a1a1a">Where the model came from, and where your call enters</text>
  <text x="18" y="50" font-size="13" fill="#555555">Two stages happen before you ever see it. Neither of them involves your data.</text>

  <!-- STAGE 1 -->
  <rect x="18" y="72" width="452" height="196" rx="5" fill="#fbfbfb" stroke="#cccccc" stroke-width="1.2"/>
  <text x="34" y="96" font-size="13.5" font-weight="bold" fill="#800000">STAGE 1 &#183; PRE-TRAINING</text>
  <text x="34" y="116" font-size="11.5" fill="#777777">months, enormous cost, done once</text>

  <rect x="34" y="130" width="116" height="56" rx="4" fill="#eef3f8" stroke="#4682b4" stroke-width="1.3"/>
  <text x="92" y="152" font-size="11.5" fill="#1a1a1a" text-anchor="middle">a very large</text>
  <text x="92" y="168" font-size="11.5" fill="#1a1a1a" text-anchor="middle">pile of text</text>

  <path d="M156.0 158.0 L177.0 158.0" stroke="#888888" stroke-width="1.4" /><polygon points="186.0,158.0 177.0,154.0 177.0,162.0" fill="#888888"/>

  <rect x="192" y="122" width="136" height="72" rx="4" fill="#f6eaea" stroke="#800000" stroke-width="1.3"/>
  <text x="260" y="143" font-size="11.5" fill="#1a1a1a" text-anchor="middle">hide the next token,</text>
  <text x="260" y="159" font-size="11.5" fill="#1a1a1a" text-anchor="middle">guess it, measure</text>
  <text x="260" y="175" font-size="11.5" fill="#1a1a1a" text-anchor="middle">the error</text>

  <path d="M334.0 158.0 L355.0 158.0" stroke="#888888" stroke-width="1.4" /><polygon points="364.0,158.0 355.0,154.0 355.0,162.0" fill="#888888"/>

  <rect x="370" y="130" width="86" height="56" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  <text x="413" y="152" font-size="11.5" fill="#1a1a1a" text-anchor="middle">base</text>
  <text x="413" y="168" font-size="11.5" fill="#1a1a1a" text-anchor="middle">model</text>

  <path d="M413 186 L413 216 L262 216 L262 202" stroke="#800000" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/><polygon points="260,194 265.0,203.0 257.0,203.0" fill="#800000"/>
  <text x="300" y="238" font-size="11" fill="#800000" text-anchor="middle" font-style="italic">backpropagation: nudge every weight toward a smaller error,</text>
  <text x="300" y="253" font-size="11" fill="#800000" text-anchor="middle" font-style="italic">then do it again on the next piece of text</text>

  <!-- STAGE 2 -->
  <rect x="500" y="72" width="462" height="196" rx="5" fill="#fbfbfb" stroke="#cccccc" stroke-width="1.2"/>
  <text x="516" y="96" font-size="13.5" font-weight="bold" fill="#800000">STAGE 2 &#183; POST-TRAINING</text>
  <text x="516" y="116" font-size="11.5" fill="#777777">far smaller, and where the judgments get shaped</text>

  <rect x="516" y="130" width="130" height="40" rx="4" fill="#eef3f8" stroke="#4682b4" stroke-width="1.3"/>
  <text x="581" y="146" font-size="11.5" fill="#1a1a1a" text-anchor="middle">instruction tuning</text>
  <text x="581" y="161" font-size="10.5" fill="#777777" text-anchor="middle">examples of good answers</text>

  <rect x="516" y="178" width="130" height="40" rx="4" fill="#eef3f8" stroke="#4682b4" stroke-width="1.3"/>
  <text x="581" y="194" font-size="11.5" fill="#1a1a1a" text-anchor="middle">preference tuning</text>
  <text x="581" y="209" font-size="10.5" fill="#777777" text-anchor="middle">people rank rival answers</text>

  <path d="M652.0 148.0 L682.0 163.8" stroke="#888888" stroke-width="1.4" /><polygon points="690.0,168.0 683.9,160.3 680.2,167.3" fill="#888888"/>
  <path d="M652.0 198.0 L682.0 182.2" stroke="#888888" stroke-width="1.4" /><polygon points="690.0,178.0 680.2,178.7 683.9,185.7" fill="#888888"/>

  <rect x="696" y="146" width="112" height="56" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.6"/>
  <text x="752" y="168" font-size="11.5" fill="#1a1a1a" text-anchor="middle">the assistant</text>
  <text x="752" y="184" font-size="11.5" fill="#1a1a1a" text-anchor="middle">you call</text>

  <rect x="828" y="146" width="118" height="56" rx="4" fill="#fff6e8" stroke="#e69f00" stroke-width="1.4"/>
  <text x="887" y="162" font-size="11.5" fill="#1a1a1a" text-anchor="middle">weights frozen</text>
  <text x="887" y="178" font-size="10.5" fill="#777777" text-anchor="middle">until the provider</text>
  <text x="887" y="192" font-size="10.5" fill="#777777" text-anchor="middle">replaces them</text>
  <path d="M812.0 174.0 L815.0 174.0" stroke="#888888" stroke-width="1.4" /><polygon points="824.0,174.0 815.0,170.0 815.0,178.0" fill="#888888"/>

  <path d="M462.0 158.0 L487.0 158.0" stroke="#888888" stroke-width="1.6" /><polygon points="496.0,158.0 487.0,154.0 487.0,162.0" fill="#888888"/>

  <!-- STAGE 3 -->
  <line x1="18" y1="292" x2="962" y2="292" stroke="#dddddd" stroke-width="1"/>
  <text x="18" y="318" font-size="13.5" font-weight="bold" fill="#4682b4">AND THEN YOUR CALL</text>

  <rect x="18" y="330" width="150" height="40" rx="4" fill="#eef3f8" stroke="#4682b4" stroke-width="1.3"/>
  <text x="93" y="346" font-size="11.5" fill="#1a1a1a" text-anchor="middle">your prompt</text>
  <text x="93" y="361" font-size="10.5" fill="#777777" text-anchor="middle">instructions, examples, a tweet</text>

  <path d="M174.0 350.0 L197.0 350.0" stroke="#888888" stroke-width="1.4" /><polygon points="206.0,350.0 197.0,346.0 197.0,354.0" fill="#888888"/>

  <rect x="212" y="330" width="150" height="40" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  <text x="287" y="354" font-size="11.5" fill="#1a1a1a" text-anchor="middle">the frozen assistant</text>

  <path d="M368.0 350.0 L391.0 350.0" stroke="#888888" stroke-width="1.4" /><polygon points="400.0,350.0 391.0,346.0 391.0,354.0" fill="#888888"/>

  <rect x="406" y="330" width="150" height="40" rx="4" fill="#eef3f8" stroke="#4682b4" stroke-width="1.3"/>
  <text x="481" y="354" font-size="11.5" fill="#1a1a1a" text-anchor="middle">tokens back to you</text>

  <text x="580" y="345" font-size="12.5" fill="#800000" font-weight="bold">Nothing here changes the model.</text>
  <text x="580" y="363" font-size="11.5" fill="#1a1a1a">Your prompt is read and discarded. Few-shot examples teach nothing</text>
  <text x="580" y="379" font-size="11.5" fill="#1a1a1a">that survives the call, which is why none of this is "training."</text>

  <text x="18" y="404" font-size="11.5" fill="#777777" font-style="italic">The context window is the ceiling on how much text stage 3 can hold at once: prompt and reply together.</text>

  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#800000"/>
    </marker>
  </defs>
</svg>
